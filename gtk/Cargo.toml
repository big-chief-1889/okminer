[package]
name = "okminer"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
async-channel = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
panic = "abort"
